name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm install
      - run: npm run lint

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm install
      - run: npm test

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm install
      - name: Convert Petstore (OAS3)
        run: |
          mkdir -p out
          node widdershins.js -o out/petstore.md defs/petstore3.json
          echo "OAS3 output: $(wc -l < out/petstore.md) lines"
      - name: Convert Petstore (OAS2)
        run: node widdershins.js -o out/petstore2.md defs/petstore.json
      - name: Convert AsyncAPI
        run: node widdershins.js -o out/async.md defs/asyncapi12a.yaml
      - name: Convert Semoasa
        run: node widdershins.js -o out/semoasa.md defs/semoasa1.yaml
