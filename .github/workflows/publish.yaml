name: Publish to npm and GitHub Packages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.0.0)'
        required: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm install
      - run: npm run lint
      - run: npm test

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [ci]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install
      - name: Check if version exists on npm
        id: check-npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view widdershins-reborn@"$VERSION" version 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION already published to npm — skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION not on npm — will publish"
          fi
      - name: Publish to npm
        if: steps.check-npm.outputs.exists == 'false'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-ghp:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: [ci]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@sikandarsubhani'
      - run: npm install
      - name: Check if version exists on GitHub Packages
        id: check-ghp
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view @sikandarsubhani/widdershins-reborn@"$VERSION" version --registry=https://npm.pkg.github.com 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION already published to GitHub Packages — skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION not on GitHub Packages — will publish"
          fi
      - name: Set scoped name for publish
        if: steps.check-ghp.outputs.exists == 'false'
        run: npm pkg set name='@sikandarsubhani/widdershins-reborn'
      - name: Publish to GitHub Packages
        if: steps.check-ghp.outputs.exists == 'false'
        run: npm publish --access=public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore unscoped name
        if: steps.check-ghp.outputs.exists == 'false'
        run: npm pkg set name='widdershins-reborn'
